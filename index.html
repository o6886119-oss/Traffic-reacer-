<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Racer - Pro HD Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020408;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111;
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Touch Controls */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 28px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }
        .ui-score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 18, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen h1 {
            font-size: 38px;
            color: #00e5ff;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            letter-spacing: 2px;
        }
        .screen p {
            font-size: 16px;
            color: #90a4ae;
            margin-bottom: 30px;
        }
        .menu-btn {
            background: linear-gradient(135deg, #00b0ff, #002884);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 20px rgba(0, 176, 255, 0.4);
            transition: 0.2s;
            width: 240px;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        .secondary-btn {
            background: linear-gradient(135deg, #455a64, #263238);
            box-shadow: 0 6px 20px rgba(69, 90, 100, 0.4);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-score" id="scoreDisplay">Score: 0</div>
        
        <!-- Main Menu -->
        <div id="mainMenu" class="screen">
            <h1>TRAFFIC RACER</h1>
            <p>Pro HD Bridge Edition</p>
            <button class="menu-btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1>CRASHED!</h1>
            <p id="finalScore">Score: 0</p>
            <button class="menu-btn" onclick="restartGame()">Play Again</button>
            <button class="menu-btn secondary-btn" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div class="controls">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let score = 0;
        let gameActive = false;
        let roadOffset = 0;

        let car = {
            x: 200,
            y: 520,
            width: 52,
            height: 98,
            dx: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = -7.5; });
        leftBtn.addEventListener('touchend', () => { car.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { car.dx = -7.5; });
        leftBtn.addEventListener('mouseup', () => { car.dx = 0; });

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = 7.5; });
        rightBtn.addEventListener('touchend', () => { car.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { car.dx = 7.5; });
        rightBtn.addEventListener('mouseup', () => { car.dx = 0; });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') car.dx = -7.5;
            if (e.key === 'ArrowRight') car.dx = 7.5;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') car.dx = 0;
        });

        function startGame() {
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function restartGame() {
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function goToMainMenu() {
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            gameActive = false;
        }

        function spawnObstacle() {
            let laneX = [118, 200, 282];
            let chosenX = laneX[Math.floor(Math.random() * laneX.length)];
            let types = [
                {w: 52, h: 98, col: '#ff1744'}, // Red Sports Car
                {w: 56, h: 120, col: '#eceff1'}, // White Truck
                {w: 52, h: 98, col: '#ffea00'}  // Yellow Sport Car
            ];
            let t = types[Math.floor(Math.random() * types.length)];
            
            obstacles.push({
                x: chosenX - t.w / 2,
                y: -140,
                width: t.w,
                height: t.h,
                speed: 4.2,
                color: t.col
            });
        }

        function update() {
            if (!gameActive) return;

            car.x += car.dx;
            if (car.x < 70) car.x = 70;
            if (car.x > 330 - car.width) car.x = 330 - car.width;

            roadOffset = (roadOffset + 12) % 50;

            obstacleTimer++;
            if (obstacleTimer > 48) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed + 3.8;

                if (
                    car.x < obstacles[i].x + obstacles[i].width - 6 &&
                    car.x + car.width > obstacles[i].x + 6 &&
                    car.y < obstacles[i].y + obstacles[i].height - 6 &&
                    car.y + car.height > obstacles[i].y + 6
                ) {
                    gameActive = false;
                    finalScore.innerText = "Score: " + score;
                    gameOverScreen.classList.remove('hidden');
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 35;
                    scoreDisplay.innerText = "Score: " + score;
                }
            }
        }

        // Draw High-End Glossy 3D Car
        function drawCar(x, y, width, height, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Realistic Soft Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.ellipse(width/2, height/2 + 6, width/2 + 6, height/2 + 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Car Body Gradient (Metallic Look)
            let grad = ctx.createLinearGradient(0, 0, width, 0);
            grad.addColorStop(0, shadeColor(color, -35));
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, shadeColor(color, -45));

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(0, 0, width, height, [16, 16, 10, 10]);
            ctx.fill();

            // Roof & Windows
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(6, height * 0.22, width - 12, height * 0.48, [4, 4, 2, 2]);
            ctx.fill();

            // Glass Reflection
            let glassGrad = ctx.createLinearGradient(6, 0, width - 6, 0);
            glassGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
            glassGrad.addColorStop(0.5, 'rgba(255,255,255,0.08)');
            glassGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = glassGrad;
            ctx.fillRect(8, height * 0.26, width - 16, height * 0.38);

            // Tires
            ctx.fillStyle = '#111';
            ctx.fillRect(-7, 18, 7, 22);
            ctx.fillRect(width, 18, 7, 22);
            ctx.fillRect(-7, height - 30, 7, 22);
            ctx.fillRect(width, height - 30, 7, 22);

            // Glowing Tail Lights
            ctx.fillStyle = isPlayer ? '#ff1744' : '#ff3d00';
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 12;
            ctx.fillRect(4, 3, 10, 6);
            ctx.fillRect(width - 14, 3, 10, 6);

            ctx.restore();
        }

        function shadeColor(color, percent) {
            let num = parseInt(color.replace("#",""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                G = (num >> 8 & 0x00FF) + amt,
                B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, 180);
            skyGrad.addColorStop(0, '#0288d1');
            skyGrad.addColorStop(1, '#81d4fa');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 180);

            // 2. Horizon Ground Banks (Greenery)
            ctx.fillStyle = '#7cb342';
            ctx.fillRect(0, 165, canvas.width, 40);

            // 3. Water on Both Sides
            let waterGrad = ctx.createLinearGradient(0, 205, 0, canvas.height);
            waterGrad.addColorStop(0, '#0277bd');
            waterGrad.addColorStop(1, '#01579b');
            ctx.fillStyle = waterGrad;
            ctx.fillRect(0, 205, canvas.width, canvas.height - 205);

            // Water Waves
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = 230; i < canvas.height; i += 40) {
                ctx.moveTo(0, i + (roadOffset/2));
                ctx.lineTo(canvas.width, i + (roadOffset/2));
            }
            ctx.stroke();

            // Palm Trees on Sides
            [20, 380].forEach(tx => {
                for(let ty = 220; ty < canvas.height; ty += 110) {
                    ctx.fillStyle = '#33691e';
                    ctx.beginPath();
                    ctx.arc(tx, (ty + roadOffset*2) % canvas.height, 22, 0, Math.PI * 2);
                    ctx.fill();
                    // Trunk
                    ctx.fillStyle = '#5d4037';
                    ctx.fillRect(tx - 4, (ty + roadOffset*2) % canvas.height, 8, 42);
                }
            });

            // 4. Pro Bridge Highway 3D Perspective
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.moveTo(55, 205);
            ctx.lineTo(345, 205);
            ctx.lineTo(380, canvas.height);
            ctx.lineTo(20, canvas.height);
            ctx.fill();

            // Bridge Concrete Railings
            ctx.strokeStyle = '#eceff1';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(55, 205); ctx.lineTo(20, canvas.height);
            ctx.moveTo(345, 205); ctx.lineTo(380, canvas.height);
            ctx.stroke();

            // Lane Divider Dashed Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 6;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;
            
            ctx.beginPath();
            ctx.moveTo(200, 205);
            ctx.lineTo(200, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.shadowBlur = 0;

            // 5. Draw Traffic Cars
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
            });

            // 6. Draw Player Sport Car (Glowing Cyan)
            drawCar(car.x, car.y, car.width, car.height, '#00e5ff', true);
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
