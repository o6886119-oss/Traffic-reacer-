<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Racer - 3D Bridge & Highway</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050811;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Touch Controls */
        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: white;
            font-size: 28px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.93);
        }
        .ui-score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 22, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen h1 {
            font-size: 36px;
            color: #ff3d00;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.6);
            letter-spacing: 2px;
        }
        .screen p {
            font-size: 16px;
            color: #b0bec5;
            margin-bottom: 25px;
        }
        .menu-btn {
            background: #ff3d00;
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 20px rgba(255, 61, 0, 0.5);
            transition: 0.2s;
            width: 230px;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        .secondary-btn {
            background: #37474f;
            box-shadow: 0 4px 20px rgba(55, 71, 79, 0.5);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-score" id="scoreDisplay">Score: 0</div>
        
        <!-- Main Menu -->
        <div id="mainMenu" class="screen">
            <h1>TRAFFIC RACER</h1>
            <p>3D Highway & Bridge Edition</p>
            <button class="menu-btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen with Options -->
        <div id="gameOverScreen" class="screen hidden">
            <h1>CRASHED!</h1>
            <p id="finalScore">Score: 0</p>
            <button class="menu-btn" onclick="restartGame()">Play Again</button>
            <button class="menu-btn secondary-btn" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div class="controls">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let score = 0;
        let gameActive = false;
        let roadOffset = 0;

        // Player Car (3D Perspective Position)
        let car = {
            x: 200,
            y: 530,
            width: 48,
            height: 88,
            dx: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;

        // Touch & Key Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = -6.5; });
        leftBtn.addEventListener('touchend', () => { car.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { car.dx = -6.5; });
        leftBtn.addEventListener('mouseup', () => { car.dx = 0; });

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = 6.5; });
        rightBtn.addEventListener('touchend', () => { car.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { car.dx = 6.5; });
        rightBtn.addEventListener('mouseup', () => { car.dx = 0; });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') car.dx = -6.5;
            if (e.key === 'ArrowRight') car.dx = 6.5;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') car.dx = 0;
        });

        function startGame() {
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function restartGame() {
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function goToMainMenu() {
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            gameActive = false;
        }

        function spawnObstacle() {
            let laneX = [125, 200, 275]; // 3 lanes
            let chosenX = laneX[Math.floor(Math.random() * laneX.length)];
            let types = [
                {w: 48, h: 88, col: '#1e88e5'}, // Car
                {w: 52, h: 110, col: '#f5f5f5'}, // Truck/Van
                {w: 48, h: 88, col: '#43a047'}  // Car
            ];
            let t = types[Math.floor(Math.random() * types.length)];
            
            obstacles.push({
                x: chosenX - t.w / 2,
                y: -130,
                width: t.w,
                height: t.h,
                speed: 3.5,
                color: t.col
            });
        }

        function update() {
            if (!gameActive) return;

            car.x += car.dx;
            // Bridge road boundaries
            if (car.x < 85) car.x = 85;
            if (car.x > 315 - car.width) car.x = 315 - car.width;

            roadOffset = (roadOffset + 8) % 40;

            obstacleTimer++;
            if (obstacleTimer > 55) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed + 3;

                // Accurate Collision Box
                if (
                    car.x < obstacles[i].x + obstacles[i].width - 6 &&
                    car.x + car.width > obstacles[i].x + 6 &&
                    car.y < obstacles[i].y + obstacles[i].height - 6 &&
                    car.y + car.height > obstacles[i].y + 6
                ) {
                    gameActive = false;
                    finalScore.innerText = "Score: " + score;
                    gameOverScreen.classList.remove('hidden');
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 25;
                    scoreDisplay.innerText = "Score: " + score;
                }
            }
        }

        // Draw 3D Realistic Car from Behind
        function drawCar(x, y, width, height, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Drop Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(-3, 8, width + 6, height - 10);

            // Car Main Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(0, 0, width, height, [10, 10, 6, 6]);
            ctx.fill();

            // Roof & Rear Window Glass
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.roundRect(5, height * 0.25, width - 10, height * 0.45, [4, 4, 2, 2]);
            ctx.fill();

            ctx.fillStyle = '#37474f'; // Glass reflection
            ctx.fillRect(8, height * 0.3, width - 16, height * 0.25);

            // Wheels
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(-5, 14, 5, 18);
            ctx.fillRect(width, 14, 5, 18);
            ctx.fillRect(-5, height - 26, 5, 18);
            ctx.fillRect(width, height - 26, 5, 18);

            // Tail Lights (Glowing)
            ctx.fillStyle = isPlayer ? '#ff1744' : '#ff5252';
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 8;
            ctx.fillRect(4, 2, 9, 5);
            ctx.fillRect(width - 13, 2, 9, 5);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Sky & Horizon Background
            ctx.fillStyle = '#4fc3f7';
            ctx.fillRect(0, 0, canvas.width, 180);

            // Distant Desert / Ground
            ctx.fillStyle = '#d4e157';
            ctx.fillRect(0, 160, canvas.width, 40);

            // 2. River / Water on sides with Palm Trees
            ctx.fillStyle = '#0288d1';
            ctx.fillRect(0, 200, canvas.width, canvas.height - 200);

            // Water waves
            ctx.strokeStyle = '#29b6f6';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = 230; i < canvas.height; i += 45) {
                ctx.moveTo(0, i + (roadOffset/2));
                ctx.lineTo(canvas.width, i + (roadOffset/2));
            }
            ctx.stroke();

            // Palm Trees on side banks
            ctx.fillStyle = '#558b2f';
            [35, 365].forEach(tx => {
                for(let ty = 220; ty < canvas.height; ty += 120) {
                    ctx.beginPath();
                    ctx.arc(tx, (ty + roadOffset*2) % canvas.height, 18, 0, Math.PI * 2);
                    ctx.fill();
                    // Trunk
                    ctx.fillStyle = '#795548';
                    ctx.fillRect(tx - 3, (ty + roadOffset*2) % canvas.height, 6, 35);
                    ctx.fillStyle = '#558b2f';
                }
            });

            // 3. The Bridge Road (Asphalt) with 3D Perspective
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.moveTo(70, 200);
            ctx.lineTo(330, 200);
            ctx.lineTo(355, canvas.height);
            ctx.lineTo(45, canvas.height);
            ctx.fill();

            // Bridge Side Railings
            ctx.strokeStyle = '#eceff1';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(70, 200); ctx.lineTo(45, canvas.height);
            ctx.moveTo(330, 200); ctx.lineTo(355, canvas.height);
            ctx.stroke();

            // Lane Dividers (Dashed lines)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.lineDashOffset = -roadOffset;
            
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.lineTo(200, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]);

            // 4. Draw Traffic Cars (Obstacles)
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
            });

            // 5. Draw Player Car (Bright Blue Sport Car from behind)
            drawCar(car.x, car.y, car.width, car.height, '#00bcd4', true);
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
